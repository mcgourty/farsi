<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Farsi">
<meta name="theme-color" content="#f4f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1422" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Farsi flashcards</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/pwa.css">
<script src="js/pwa.js" defer></script>
<link rel="stylesheet" href="css/notes.css">
<link rel="stylesheet" href="css/drill.css">
</head>
<body>
<script>
  // Apply the saved theme before first paint (the prefs live in the store).
  try {
    var t = ((JSON.parse(localStorage.getItem('farsi-v2')) || {}).prefs || {}).theme;
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) { /* ignore */ }
</script>

<header class="topbar">
  <div class="topbar-inner">
    <button type="button" class="brand" data-action="set-view" data-arg="today" aria-label="Today">
      <span class="mark" lang="fa" aria-hidden="true">ف</span>
      <span class="brand-name">Farsi</span>
    </button>
    <!-- Tab buttons are built from the view registry (F.views) by app.js -->
    <nav class="tabs" aria-label="Views"><div class="segmented" role="tablist" id="tabs"></div></nav>
    <button type="button" class="icon-btn" id="sheet-btn" data-action="open-sheet" aria-label="Settings" aria-haspopup="dialog" aria-controls="sheet">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span class="icon-btn-label">Settings</span>
    </button>
  </div>
</header>

<div class="backup-reminder" id="backup-reminder" hidden></div>

<main id="main">
  <div class="stats-bar">
    <div class="card-count" id="card-count"></div>
    <!-- Written by the views; hidden: the meter below is the one progress bar -->
    <div class="progress-row" hidden>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-text" id="progress-text">0%</div>
    </div>
  </div>
  <div class="meter-row" id="meter-row"></div>
  <div class="scope-bar" id="scope-bar"></div>

  <div class="card-area" id="card-area"></div>

  <div class="nav-row">
    <button class="nav-btn" id="prev-btn" data-action="prev" aria-label="Previous">&#8592;</button>
    <div class="nav-pos" id="nav-pos">1 / 1</div>
    <button class="nav-btn" id="next-btn" data-action="next" aria-label="Next">&#8594;</button>
  </div>

  <div class="score-row" id="score-row"></div>

  <div class="shortcuts" id="shortcuts"></div>
</main>

<!-- Settings sheet (js/ui/sheet.js): bottom sheet on phones, side panel on wide screens -->
<div class="sheet-backdrop" id="sheet-backdrop" data-action="close-sheet" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-head">
    <h2 id="sheet-title">Settings</h2>
    <button type="button" class="icon-btn" data-action="close-sheet" aria-label="Close settings">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="sheet-body">

    <!-- Study view settings (js/ui/settings.js) -->
    <section class="sheet-sec filters" id="fc-filters" data-view-panel="cards">
      <h3 class="sec-title">What to study</h3>
      <div class="filter-group">
        <label>Study mode</label>
        <div class="pills" id="mode-pills"></div>
      </div>
      <div class="filter-group">
        <div class="filter-head">
          <label>Sessions</label>
          <div class="quick" role="group" aria-label="Quick session choice">
            <button type="button" class="quick-btn" id="sessions-newest-btn" data-action="sessions-newest">Newest only</button>
            <button type="button" class="quick-btn" id="sessions-all-btn" data-action="sessions-all">All</button>
            <button type="button" class="quick-btn" data-action="sessions-none">None</button>
          </div>
        </div>
        <div class="pills session-pills" id="session-pills"></div>
        <p class="sec-note">Bars show known &middot; learning &middot; new cards in each session.</p>
      </div>
      <div class="filter-group">
        <div class="filter-head">
          <label>Card types</label>
          <div class="quick">
            <button type="button" class="quick-btn" data-action="types-all">All</button>
            <button type="button" class="quick-btn" data-action="types-none">None</button>
          </div>
        </div>
        <div class="pills" id="type-pills"></div>
      </div>
      <div class="filter-group">
        <label>Direction</label>
        <div class="pills" id="dir-pills"></div>
      </div>
      <div class="filter-group">
        <label>Front shows</label>
        <div class="pills" id="front-pills"></div>
      </div>
    </section>

    <!-- Verb trainer settings (js/ui/settings.js) -->
    <section class="sheet-sec filters" id="vt-filters" data-view-panel="verbs" style="display:none">
      <h3 class="sec-title">Verb trainer</h3>
      <div class="filter-group">
        <label>Mode</label>
        <div class="pills" id="vt-mode-pills"></div>
      </div>
      <div class="filter-group" id="vt-tense-group">
        <div class="filter-head">
          <label>Tenses</label>
          <div class="quick">
            <button type="button" class="quick-btn" data-action="tenses-all">All</button>
            <button type="button" class="quick-btn" data-action="tenses-none">None</button>
          </div>
        </div>
        <div class="pills" id="vt-tense-pills"></div>
      </div>
      <div class="filter-group" id="vt-person-group">
        <div class="filter-head">
          <label>Person</label>
          <div class="quick">
            <button type="button" class="quick-btn" data-action="persons-all">All</button>
            <button type="button" class="quick-btn" data-action="persons-none">None</button>
          </div>
        </div>
        <div class="pills" id="vt-person-pills"></div>
      </div>
      <div class="filter-group">
        <div class="filter-head">
          <label>Verbs</label>
          <div class="quick">
            <button type="button" class="quick-btn" data-action="vtverbs-all">All</button>
            <button type="button" class="quick-btn" data-action="vtverbs-none">None</button>
          </div>
        </div>
        <div class="pills" id="vt-verb-pills"></div>
      </div>
    </section>

    <section class="sheet-sec">
      <h3 class="sec-title">Practice</h3>
      <div class="bottom-actions option-list">
        <button class="action-btn opt-row" id="newlimit-btn" title="New cards per day, counted separately for each direction" data-action="cycle-new-limit">New/day: 20</button>
        <button class="action-btn opt-row toggle" id="typed-btn" data-action="toggle-typed">Type answer</button>
        <button class="action-btn opt-row toggle" id="shuffle-btn" data-action="toggle-shuffle">Shuffle</button>
        <button class="action-btn opt-row toggle" id="mastered-btn" data-action="toggle-hide-mastered">Hide mastered</button>
        <button class="action-btn opt-row toggle" id="audio-btn" data-action="toggle-audio" hidden>Auto-play audio</button>
      </div>
    </section>

    <section class="sheet-sec">
      <h3 class="sec-title">Appearance</h3>
      <div class="filter-group">
        <label>Theme</label>
        <div class="pills" id="theme-pills"></div>
      </div>
    </section>

    <!-- Backup and restore (js/ui/backup.js) -->
    <!-- Verb trainer settings, built by js/ui/drill.js (replaces #vt-filters) -->
    <section class="sheet-sec filters" id="drill-panel" data-view-panel="verbs" style="display:none"></section>

    <section class="sheet-sec" id="backup-settings">
      <div class="filter-group" id="backup-panel"></div>
    </section>

    <!-- Two-step reset (js/ui/sheet.js) -->
    <section class="sheet-sec" id="reset-sec"></section>
  </div>
</aside>

<!-- Core (order matters: core first, then pure modules) -->
<script src="js/core.js"></script>
<script src="js/fsrs.js"></script>
<script src="js/verbs.js"></script>
<!-- Lessons: one file per session, in deck order. Add a new lesson here. -->
<script src="lessons/s22.js"></script>
<script src="lessons/s23.js"></script>
<script src="lessons/s2425.js"></script>
<script src="lessons/s26.js"></script>
<script src="lessons/s27.js"></script>
<script src="lessons/s28.js"></script>
<script src="lessons/s29.js"></script>
<script src="lessons/s30.js"></script>
<script src="lessons/s31.js"></script>
<script src="lessons/s32.js"></script>
<script src="lessons/s33.js"></script>
<script src="lessons/s34.js"></script>
<script src="lessons/s35.js"></script>
<script src="lessons/alphabet.js"></script>
<!-- Deck, storage -->
<script src="js/cards.js"></script>
<script src="js/store.js"></script>
<script src="js/md.js"></script>
<!-- UI -->
<script src="js/audio.js"></script>
<script src="js/ui/typed.js"></script>
<script src="js/ui/study.js"></script>
<script src="js/ui/drill.js"></script>
<script src="js/ui/settings.js"></script>
<script src="js/ui/backup.js"></script>
<script src="js/ui/notes.js"></script>
<script src="js/ui/sheet.js"></script>
<script src="js/ui/today.js"></script>
<script src="js/ui/progress.js"></script>
<!-- Boot: keep last -->
<script src="js/app.js"></script>
</body>
</html>
