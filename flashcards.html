<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Farsi">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Farsi Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Ink palette + tokens adapted from ../weekly */
  --bg: #f9fafb;          /* gray-50 page background */
  --surface: #ffffff;     /* white cards */
  --surface-2: #ebecef;   /* gray-150 hover rail */
  --gold: #26251e;        /* ink — primary accent (active states, progress) */
  --gold-dim: #a3a29c;    /* ink-light */
  --gold-bright: #26251e; /* ink — answer text */
  --text: #26251e;        /* ink */
  --text-dim: #5a5954;    /* ink-muted */
  --green: #117010;       /* notice success text */
  --red: #dc2626;         /* notice error text */
  --blue: #165fc6;        /* notice info text */
  --radius: 16px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Source Sans 3', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

header {
  text-align: center;
  padding: 32px 20px 16px;
}
header h1 {
  font-size: 2.4rem;
  font-weight: 900;
  letter-spacing: -0.02em;
  color: var(--text);
}
header .subtitle {
  font-size: 0.95rem;
  color: var(--text-dim);
  margin-top: 4px;
  font-weight: 300;
  direction: rtl;
  font-size: 1.1rem;
}

.filters {
  max-width: 740px;
  margin: 0 auto 12px;
  padding: 0 20px;
}
.filter-group {
  margin-bottom: 12px;
}
.filter-group label {
  display: block;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--gold-dim);
  margin-bottom: 6px;
  font-weight: 700;
}
.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.pill {
  padding: 6px 14px;
  border-radius: 99px;
  border: 1.5px solid var(--surface-2);
  background: transparent;
  color: var(--text-dim);
  font-size: 0.82rem;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
  font-weight: 600;
  white-space: nowrap;
}
.pill:hover { border-color: var(--gold-dim); color: var(--text); }
.pill.active {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--bg);
}

.stats-bar {
  max-width: 740px;
  margin: 0 auto 16px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.card-count {
  font-size: 0.85rem;
  color: var(--text-dim);
}
.card-count strong { color: var(--gold); }
.progress-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.progress-track {
  width: 120px;
  height: 4px;
  background: var(--surface-2);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 99px;
  transition: width 0.3s;
}
.progress-text {
  font-size: 0.8rem;
  color: var(--text-dim);
  min-width: 42px;
  text-align: right;
}

.card-area {
  max-width: 580px;
  margin: 0 auto;
  padding: 0 20px 20px;
  perspective: 1200px;
}
.card-wrapper {
  position: relative;
  width: 100%;
  min-height: 340px;
  cursor: pointer;
}
.card {
  width: 100%;
  min-height: 340px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}
.card.flipped { transform: rotateY(180deg); }
.card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 32px;
  border: 1.5px solid var(--surface-2);
  overflow-y: auto;
}
.card-front {
  background: linear-gradient(160deg, var(--surface), var(--surface-2));
}
.card-back {
  background: linear-gradient(160deg, var(--surface-2), #1a2438);
  transform: rotateY(180deg);
  border-color: var(--gold-dim);
}
.front-content {
  text-align: center;
  width: 100%;
}
.farsi-big {
  font-size: 3rem;
  direction: rtl;
  line-height: 1.4;
  font-weight: 400;
  color: #fff;
  word-break: break-word;
}
.english-big {
  font-size: 1.6rem;
  font-weight: 700;
  color: #fff;
}
.card-tag {
  position: absolute;
  top: 14px;
  left: 16px;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-dim);
  background: var(--bg);
  padding: 3px 10px;
  border-radius: 99px;
  font-weight: 700;
}
.tap-hint {
  position: absolute;
  bottom: 14px;
  font-size: 0.72rem;
  color: var(--text-dim);
  opacity: 0.5;
}
.back-content {
  text-align: center;
  width: 100%;
}
.back-content .farsi-answer {
  font-size: 2.2rem;
  direction: rtl;
  color: var(--gold-bright);
  margin-bottom: 12px;
  line-height: 1.4;
}
.back-content .pinglish {
  font-size: 1.15rem;
  color: var(--blue);
  font-style: italic;
  margin-bottom: 10px;
}
.back-content .meaning {
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 14px;
}
.back-content .breakdown {
  font-size: 0.88rem;
  color: var(--text-dim);
  line-height: 1.6;
  border-top: 1px solid var(--surface-2);
  padding-top: 12px;
  margin-top: 4px;
}
.letter-forms {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 12px 0;
  width: 100%;
  max-width: 320px;
}
.letter-form-cell {
  text-align: center;
  padding: 8px 4px;
  background: var(--bg);
  border-radius: 8px;
}
.letter-form-cell .form-label {
  font-size: 0.6rem;
  text-transform: uppercase;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  margin-bottom: 4px;
}
.letter-form-cell .form-char {
  font-size: 2rem;
  direction: rtl;
  color: var(--gold-bright);
}

.nav-row {
  max-width: 580px;
  margin: 0 auto;
  padding: 0 20px 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
}
.nav-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1.5px solid var(--surface-2);
  background: var(--surface);
  color: var(--text);
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.nav-btn:hover { border-color: var(--gold); color: var(--gold); }
.nav-btn:disabled { opacity: 0.25; cursor: default; border-color: var(--surface-2); color: var(--text-dim); }
.nav-pos {
  font-size: 0.9rem;
  color: var(--text-dim);
  min-width: 80px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.bottom-actions {
  max-width: 580px;
  margin: 0 auto;
  padding: 0 20px 16px;
  display: flex;
  justify-content: center;
  gap: 8px;
}
.action-btn {
  padding: 8px 18px;
  border-radius: 99px;
  border: 1.5px solid var(--surface-2);
  background: transparent;
  color: var(--text-dim);
  font-size: 0.8rem;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
  font-weight: 600;
}
.action-btn:hover { border-color: var(--gold-dim); color: var(--text); }
.action-btn.active { background: var(--surface-2); color: var(--gold); border-color: var(--gold-dim); }

.score-row {
  max-width: 580px;
  margin: 0 auto;
  padding: 0 20px 32px;
  display: flex;
  justify-content: center;
  gap: 20px;
}
.score-btn {
  padding: 10px 28px;
  border-radius: var(--radius);
  border: none;
  font-size: 0.9rem;
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}
.score-btn.know {
  background: rgba(61, 220, 132, 0.15);
  color: var(--green);
  border: 1.5px solid rgba(61, 220, 132, 0.3);
}
.score-btn.know:hover { background: rgba(61, 220, 132, 0.25); }
.score-btn.dunno {
  background: rgba(255, 107, 107, 0.15);
  color: var(--red);
  border: 1.5px solid rgba(255, 107, 107, 0.3);
}
.score-btn.dunno:hover { background: rgba(255, 107, 107, 0.25); }

.shortcuts {
  max-width: 580px;
  margin: 0 auto;
  padding: 0 20px 40px;
  text-align: center;
}
.shortcuts span {
  font-size: 0.7rem;
  color: var(--text-dim);
  opacity: 0.5;
}
kbd {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 4px;
  border: 1px solid var(--surface-2);
  background: var(--surface);
  font-family: inherit;
  font-size: 0.68rem;
  margin: 0 1px;
}

.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-dim);
}
.empty-state h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem;
  color: var(--text);
  margin-bottom: 8px;
}

.dir-toggle {
  display: flex;
  gap: 0;
  border-radius: 99px;
  overflow: hidden;
  border: 1.5px solid var(--surface-2);
  margin-bottom: 12px;
  max-width: 740px;
  margin-left: auto;
  margin-right: auto;
  padding: 0 20px;
}
.dir-btn {
  flex: 1;
  padding: 8px 12px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 0.82rem;
  font-family: inherit;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.15s;
}
.dir-btn.active { background: var(--gold); color: var(--bg); }

.tabs {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 14px 20px 18px;
}
.tab-btn {
  padding: 9px 26px;
  border-radius: 99px;
  border: 1.5px solid var(--surface-2);
  background: transparent;
  color: var(--text-dim);
  font-size: 0.92rem;
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}
.tab-btn:hover { border-color: var(--gold-dim); color: var(--text); }
.tab-btn.active { background: var(--gold); border-color: var(--gold); color: var(--bg); }

.mastered-badge {
  position: absolute;
  top: 14px;
  right: 16px;
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 700;
  color: var(--green);
  background: rgba(61, 220, 132, 0.08);
  border: 1px solid rgba(61, 220, 132, 0.35);
  padding: 3px 10px;
  border-radius: 99px;
}

.conj-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  font-size: 0.78rem;
}
.conj-table th {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--gold-dim);
  padding: 4px 6px;
  text-align: left;
  border-bottom: 1px solid var(--surface-2);
  font-weight: 700;
}
.conj-table td {
  padding: 5px 6px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  text-align: left;
  vertical-align: top;
}
.conj-table td.person {
  color: var(--text-dim);
  font-weight: 600;
  white-space: nowrap;
}
.conj-table td .fa {
  display: block;
  direction: rtl;
  text-align: left;
  color: var(--gold-bright);
  font-size: 0.95rem;
  line-height: 1.3;
}
.conj-table td .pin {
  color: var(--text);
  font-style: italic;
}
.conj-imp {
  margin-top: 12px;
  font-size: 0.82rem;
  color: var(--text-dim);
  border-top: 1px solid var(--surface-2);
  padding-top: 10px;
  line-height: 1.8;
  text-align: left;
}
.conj-imp strong { color: var(--blue); font-style: italic; font-weight: 600; }
.conj-imp .fa-inline { color: var(--gold-bright); direction: rtl; unicode-bidi: embed; }

.drill-chips {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 20px;
  flex-wrap: wrap;
}
.chip {
  padding: 5px 16px;
  border-radius: 99px;
  font-size: 0.82rem;
  font-weight: 700;
}
.chip.person {
  background: rgba(91, 158, 240, 0.12);
  color: var(--blue);
  border: 1px solid rgba(91, 158, 240, 0.3);
}
.chip.tense {
  background: rgba(212, 162, 69, 0.12);
  color: var(--gold-bright);
  border: 1px solid rgba(212, 162, 69, 0.3);
}
.drill-verb-pin {
  font-size: 1.2rem;
  color: var(--blue);
  font-style: italic;
  margin-top: 8px;
}
.drill-verb-en {
  font-size: 0.95rem;
  color: var(--text-dim);
  margin-top: 4px;
}

@media (max-width: 520px) {
  header h1 { font-size: 1.8rem; }
  .farsi-big { font-size: 2.2rem; }
  .card-face { padding: 32px 20px; }
  .card-wrapper, .card { min-height: 300px; }
}
</style>
<style>
/* ============================================================
   DESIGN SYSTEM — 2026 refresh
   Warm paper light mode, deep neutral dark mode, one terracotta
   accent, hairline borders, layered micro-shadows, Inter + Vazirmatn.
   This block is the theme layer: it overrides the structural
   block above and is the only place colours are decided.
   ============================================================ */

:root {
  color-scheme: light dark;

  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-title: var(--font-sans);
  --font-hero: var(--font-sans);
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  --font-farsi: "Vazirmatn", "SF Arabic", "Geeza Pro", Tahoma, sans-serif;

  /* Surfaces — warm paper */
  --bg: #faf9f7;
  --bg-tint: #f4f2ee;
  --surface: #ffffff;
  --surface-2: #f4f2ee;
  --surface-3: #edeae4;

  /* Ink */
  --text: #1a1917;
  --text-dim: #6b6862;
  --ink: #1a1917;
  --ink-muted: #55524c;
  --ink-light: #93908a;

  /* Lines */
  --line: rgba(24, 23, 20, 0.09);
  --line-strong: rgba(24, 23, 20, 0.16);
  --gray-100: #f4f2ee;
  --gray-150: #edeae4;
  --gray-200: rgba(24, 23, 20, 0.09);

  /* Accent — terracotta */
  --accent: #c15f3c;
  --accent-soft: rgba(193, 95, 60, 0.10);
  --accent-line: rgba(193, 95, 60, 0.28);
  --accent-contrast: #ffffff;

  /* Semantic */
  --ok: #2f7d4f;
  --ok-soft: rgba(47, 125, 79, 0.10);
  --ok-line: rgba(47, 125, 79, 0.26);
  --warn: #99631a;
  --warn-soft: rgba(153, 99, 26, 0.10);
  --warn-line: rgba(153, 99, 26, 0.26);
  --bad: #c0392f;
  --bad-soft: rgba(192, 57, 47, 0.10);
  --bad-line: rgba(192, 57, 47, 0.26);
  --info: #2f5fa8;
  --info-soft: rgba(47, 95, 168, 0.10);
  --info-line: rgba(47, 95, 168, 0.26);

  /* Legacy aliases kept so the structural block still resolves */
  --gold: var(--accent);
  --gold-dim: var(--ink-light);
  --gold-bright: var(--accent);
  --green: var(--ok);
  --red: var(--bad);
  --blue: var(--info);

  --shadow-xs: 0 1px 1px rgba(24, 23, 20, 0.04);
  --shadow-sm: 0 1px 2px rgba(24, 23, 20, 0.05), 0 1px 1px rgba(24, 23, 20, 0.03);
  --shadow-md: 0 1px 2px rgba(24, 23, 20, 0.05), 0 8px 24px -12px rgba(24, 23, 20, 0.18);
  --shadow-lg: 0 1px 2px rgba(24, 23, 20, 0.05), 0 20px 48px -24px rgba(24, 23, 20, 0.28);

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --radius: 18px;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --dur: 140ms;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0c0d;
    --bg-tint: #131315;
    --surface: #151517;
    --surface-2: #1c1c1f;
    --surface-3: #232326;

    --text: #ececea;
    --text-dim: #94918c;
    --ink: #ececea;
    --ink-muted: #b3afa8;
    --ink-light: #7c7974;

    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.16);
    --gray-100: #1c1c1f;
    --gray-150: #232326;
    --gray-200: rgba(255, 255, 255, 0.09);

    --accent: #e08056;
    --accent-soft: rgba(224, 128, 86, 0.13);
    --accent-line: rgba(224, 128, 86, 0.32);
    --accent-contrast: #14100d;

    --ok: #5fc98a;
    --ok-soft: rgba(95, 201, 138, 0.13);
    --ok-line: rgba(95, 201, 138, 0.30);
    --warn: #dfa451;
    --warn-soft: rgba(223, 164, 81, 0.13);
    --warn-line: rgba(223, 164, 81, 0.30);
    --bad: #f0736a;
    --bad-soft: rgba(240, 115, 106, 0.13);
    --bad-line: rgba(240, 115, 106, 0.30);
    --info: #7aa8f0;
    --info-soft: rgba(122, 168, 240, 0.13);
    --info-line: rgba(122, 168, 240, 0.30);

    --shadow-xs: 0 1px 1px rgba(0, 0, 0, 0.3);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
    --shadow-lg: 0 1px 2px rgba(0, 0, 0, 0.4), 0 20px 48px -24px rgba(0, 0, 0, 0.75);
  }
}

/* ---------- Base ---------- */

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "cv05" 1, "ss03" 1, "calt" 1;
  letter-spacing: -0.005em;
}
::selection { background: var(--accent-soft); color: var(--text); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  .card { transition: none !important; }
}

/* ---------- Header ---------- */

header {
  padding: 0;
  text-align: left;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  position: sticky;
  top: 0;
  z-index: 20;
}
.header-inner {
  max-width: 740px;
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.wordmark {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.wordmark .mark {
  width: 26px;
  height: 26px;
  flex: none;
  border-radius: 7px;
  background: var(--accent);
  color: var(--accent-contrast);
  font-family: var(--font-farsi);
  font-size: 0.95rem;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
}
header h1 {
  font-family: var(--font-sans);
  font-size: 0.98rem;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--text);
  line-height: 1.2;
}
header .subtitle {
  font-family: var(--font-farsi);
  font-size: 0.86rem;
  font-weight: 400;
  color: var(--ink-light);
  margin-top: 0;
  direction: rtl;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- Tabs — segmented control ---------- */

.tabs {
  padding: 20px 20px 18px;
  gap: 0;
}
.segmented {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  border-radius: 11px;
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.tab-btn {
  font-family: var(--font-sans);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--ink-muted);
  font-weight: 500;
  font-size: 0.85rem;
  letter-spacing: -0.005em;
  padding: 7px 18px;
  box-shadow: none;
  transition: color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.tab-btn:hover { background: transparent; color: var(--text); border-color: transparent; }
.tab-btn.active {
  background: var(--surface);
  border-color: var(--line);
  color: var(--text);
  box-shadow: var(--shadow-sm);
  font-weight: 560;
}

/* ---------- Filters ---------- */

.filters { max-width: 740px; }
.filter-group { margin-bottom: 16px; }
.filter-group label {
  font-family: var(--font-mono);
  font-size: 0.63rem;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--ink-light);
  font-weight: 500;
  margin-bottom: 8px;
}
.pills { gap: 5px; }
.pill {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 7px;
  color: var(--ink-muted);
  font-weight: 470;
  font-size: 0.79rem;
  letter-spacing: -0.005em;
  padding: 5px 11px;
  box-shadow: var(--shadow-xs);
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.pill:hover { background: var(--surface-2); color: var(--text); border-color: var(--line-strong); }
.pill.active {
  background: var(--text);
  border-color: var(--text);
  color: var(--bg);
  font-weight: 500;
  box-shadow: var(--shadow-xs);
}
.pill.active:hover { background: var(--text); border-color: var(--text); color: var(--bg); filter: brightness(1.15); }

/* ---------- Stats bar ---------- */

.stats-bar { max-width: 740px; margin-bottom: 20px; }
.card-count { font-size: 0.8rem; color: var(--ink-light); letter-spacing: -0.003em; }
.card-count strong { color: var(--text); font-weight: 560; }
.progress-track {
  height: 4px;
  width: 120px;
  background: var(--surface-3);
  border: none;
  border-radius: 99px;
}
.progress-fill { background: var(--accent); transition: width 400ms var(--ease); }
.progress-text {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--ink-light);
  font-variant-numeric: tabular-nums;
}

/* ---------- Card ---------- */

.card-area { max-width: 600px; }
.card-face {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-md);
  padding: 44px 32px;
}
.card-front { background: var(--surface); }
.card-back {
  background: var(--surface);
  border-color: var(--line);
  box-shadow: var(--shadow-lg);
}
.card-wrapper:hover .card-face { border-color: var(--line-strong); }

.farsi-big {
  font-family: var(--font-farsi);
  font-weight: 500;
  color: var(--text);
  letter-spacing: 0;
  line-height: 1.55;
}
.english-big {
  color: var(--text);
  font-weight: 560;
  letter-spacing: -0.02em;
  line-height: 1.3;
}
.back-content .farsi-answer {
  font-family: var(--font-farsi);
  font-weight: 500;
  color: var(--text);
  line-height: 1.55;
}
.back-content .pinglish {
  color: var(--accent);
  font-style: normal;
  font-weight: 450;
  letter-spacing: -0.005em;
}
.back-content .meaning { color: var(--text); font-weight: 560; letter-spacing: -0.015em; }
.back-content .breakdown {
  color: var(--ink-muted);
  border-top: 1px solid var(--line);
  font-size: 0.85rem;
  padding-top: 14px;
}

.card-tag {
  font-family: var(--font-mono);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink-light);
  font-weight: 500;
  letter-spacing: 0.04em;
  font-size: 0.58rem;
  padding: 3px 8px;
  text-transform: none;
}
.tap-hint {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  letter-spacing: 0.04em;
  color: var(--ink-light);
  opacity: 1;
}
.mastered-badge {
  font-family: var(--font-mono);
  background: var(--ok-soft);
  border: 1px solid var(--ok-line);
  border-radius: 6px;
  color: var(--ok);
  letter-spacing: 0.05em;
  font-size: 0.55rem;
  font-weight: 500;
  box-shadow: none;
  padding: 3px 8px;
}

.letter-form-cell {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.letter-form-cell .form-label {
  font-family: var(--font-mono);
  font-size: 0.55rem;
  letter-spacing: 0.06em;
  color: var(--ink-light);
}
.letter-form-cell .form-char { font-family: var(--font-farsi); color: var(--text); }

/* ---------- Nav + actions ---------- */

.nav-btn {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  width: 36px;
  height: 36px;
  font-size: 0.95rem;
  color: var(--ink-muted);
  box-shadow: var(--shadow-xs);
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.nav-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--line-strong); }
.nav-btn:disabled { background: var(--surface); color: var(--ink-light); opacity: 0.4; }
.nav-pos {
  font-family: var(--font-mono);
  font-size: 0.74rem;
  color: var(--ink-light);
  letter-spacing: 0.02em;
}

.bottom-actions { gap: 6px; }
.action-btn {
  font-family: var(--font-sans);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--ink-muted);
  font-weight: 470;
  font-size: 0.775rem;
  letter-spacing: -0.005em;
  padding: 6px 13px;
  box-shadow: var(--shadow-xs);
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.action-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--line-strong); }
.action-btn.active {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent);
  font-weight: 550;
}

/* ---------- Grading row ---------- */

.score-row { gap: 8px; flex-wrap: wrap; }
.score-btn {
  font-family: var(--font-sans);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  border-radius: var(--r-md);
  padding: 9px 18px;
  min-width: 92px;
  font-size: 0.84rem;
  font-weight: 520;
  letter-spacing: -0.008em;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--ink-muted);
  box-shadow: var(--shadow-sm);
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.score-sub {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 0.02em;
  opacity: 0.7;
  font-weight: 400;
}
.score-btn.again { background: var(--bad-soft);  border-color: var(--bad-line);  color: var(--bad); }
.score-btn.hard  { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
.score-btn.know  { background: var(--ok-soft);   border-color: var(--ok-line);   color: var(--ok); }
.score-btn.dunno { background: var(--bad-soft);  border-color: var(--bad-line);  color: var(--bad); }
.score-btn.easy  { background: var(--info-soft); border-color: var(--info-line); color: var(--info); }
.score-btn.show {
  background: var(--text);
  border-color: var(--text);
  color: var(--bg);
  min-width: 250px;
  padding: 11px 28px;
  font-weight: 550;
  box-shadow: var(--shadow-md);
}
.score-btn.bury {
  background: var(--surface-2);
  border-color: var(--line);
  color: var(--ink-muted);
}
.score-btn.unbury {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent);
}
.score-btn.again:hover, .score-btn.hard:hover, .score-btn.easy:hover,
.score-btn.know:hover, .score-btn.dunno:hover, .score-btn.show:hover,
.score-btn.bury:hover, .score-btn.unbury:hover {
  transform: translateY(-1px);
  border-color: currentColor;
}
.score-btn.show:hover { border-color: var(--text); filter: brightness(1.12); }
.score-btn.suggest { box-shadow: 0 0 0 3px var(--bad-soft), var(--shadow-sm); }

/* ---------- Shortcuts ---------- */

.shortcuts span {
  font-family: var(--font-mono);
  font-size: 0.66rem;
  letter-spacing: 0.01em;
  color: var(--ink-light);
  opacity: 1;
}
kbd {
  font-family: var(--font-mono);
  background: var(--surface);
  border: 1px solid var(--line);
  border-bottom: 2px solid var(--line-strong);
  border-radius: 5px;
  font-size: 0.63rem;
  padding: 1px 5px;
  color: var(--ink-muted);
}

/* ---------- Empty state ---------- */

.empty-state { color: var(--ink-light); }
.empty-state h2 {
  font-family: var(--font-sans);
  font-weight: 580;
  font-size: 1.15rem;
  color: var(--text);
  letter-spacing: -0.02em;
}

/* ---------- Verb trainer ---------- */

.conj-table th {
  font-family: var(--font-mono);
  font-size: 0.57rem;
  letter-spacing: 0.07em;
  color: var(--ink-light);
  border-bottom: 1px solid var(--line);
  font-weight: 500;
}
.conj-table td { border-bottom: 1px solid var(--line); }
.conj-table td.person { color: var(--ink-light); font-weight: 450; }
.conj-table td .fa { font-family: var(--font-farsi); color: var(--text); }
.conj-table td .pin { color: var(--ink-muted); font-style: normal; }
.conj-imp { color: var(--ink-muted); border-top: 1px solid var(--line); }
.conj-imp strong { color: var(--accent); font-style: normal; font-weight: 550; }
.conj-imp .fa-inline { font-family: var(--font-farsi); color: var(--text); }

.chip {
  border-radius: 7px;
  font-weight: 500;
  font-size: 0.78rem;
  letter-spacing: -0.005em;
  padding: 5px 13px;
  box-shadow: none;
}
.chip.person { background: var(--info-soft); border: 1px solid var(--info-line); color: var(--info); }
.chip.tense  { background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent); }
.drill-verb-pin { color: var(--accent); font-style: normal; }
.drill-verb-en { color: var(--ink-light); }

/* ---------- Typed recall ---------- */

.typed-input {
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-family: var(--font-sans);
  color: var(--text);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.typed-input::placeholder { color: var(--ink-light); }
.typed-input:focus {
  border-color: var(--accent-line);
  background: var(--surface);
  box-shadow: 0 0 0 3px var(--accent-soft);
  outline: none;
}
.typed-banner { border-radius: 9px; font-weight: 500; font-size: 0.8rem; }
.typed-banner.right { background: var(--ok-soft);  border: 1px solid var(--ok-line);  color: var(--ok); }
.typed-banner.wrong { background: var(--bad-soft); border: 1px solid var(--bad-line); color: var(--bad); }

.due-chip {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 0.04em;
  color: var(--ink-light);
}

.filter-toggle { display: none; }
.phone-hint { display: none; }

/* ---------- Filter group headers + bulk actions ---------- */

.filter-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}
.filter-head label { margin-bottom: 0; }
.filter-acts { display: flex; gap: 2px; flex: none; }
.mini {
  font-family: var(--font-sans);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  color: var(--ink-light);
  font-size: 0.72rem;
  font-weight: 470;
  letter-spacing: -0.003em;
  padding: 3px 7px;
  cursor: pointer;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.mini:hover { background: var(--surface-2); color: var(--text); }

/* ---------- Card-state colours ----------
   Mid-tones on purpose: these sit on white chips, near-black chips, and the
   inverted fill of an active pill, and stay legible on all three. */

.seg-mature   { background: #3fa76a; }
.seg-young    { background: #4a86d8; }
.seg-learning { background: #d99a2b; }
.seg-new      { background: var(--ink-light); opacity: 0.45; }

/* ---------- Per-session meter inside a pill ---------- */

.pill.has-meter {
  display: inline-flex;
  flex-direction: column;
  align-items: stretch;
  gap: 5px;
  padding: 5px 11px 6px;
  min-width: 92px;
  --meter-track: var(--surface-3);
}
.pill.has-meter.active { --meter-track: color-mix(in srgb, var(--bg) 32%, transparent); }
.pill .pill-text { display: block; text-align: center; }
.pill .meter {
  display: flex;
  height: 3px;
  border-radius: 2px;
  overflow: hidden;
  background: var(--meter-track);
}
.pill .seg { height: 100%; display: block; }

/* ---------- Scope breakdown bar ---------- */

.scope-bar {
  max-width: 740px;
  margin: 0 auto 18px;
  padding: 0 20px;
}
.scope-track {
  display: flex;
  height: 6px;
  border-radius: 99px;
  overflow: hidden;
  background: var(--surface-3);
}
.scope-seg { height: 100%; display: block; }
.scope-legend {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 14px;
  margin-top: 9px;
}
.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.75rem;
  color: var(--ink-light);
  letter-spacing: -0.003em;
  cursor: default;
}
.legend-item b { color: var(--text); font-weight: 550; font-variant-numeric: tabular-nums; }
.legend-pct {
  font-family: var(--font-mono);
  font-size: 0.66rem;
  color: var(--ink-light);
  font-variant-numeric: tabular-nums;
}
.dot { width: 7px; height: 7px; border-radius: 2px; display: block; flex: none; }
.scope-note {
  font-family: var(--font-sans);
  margin-left: auto;
  background: var(--warn-soft);
  border: 1px solid var(--warn-line);
  border-radius: 7px;
  color: var(--warn);
  font-size: 0.72rem;
  font-weight: 500;
  padding: 3px 10px;
  cursor: pointer;
  transition: filter var(--dur) var(--ease);
}
.scope-note:hover { filter: brightness(0.96); }
.scope-empty { font-size: 0.78rem; color: var(--ink-light); }

.stat-today { color: var(--ink-muted); }
.stat-streak { color: var(--accent); font-weight: 550; }

/* ---------- Leech ---------- */

.leech-badge {
  position: absolute;
  top: 14px;
  right: 16px;
  font-family: var(--font-mono);
  background: var(--warn-soft);
  border: 1px solid var(--warn-line);
  border-radius: 6px;
  color: var(--warn);
  letter-spacing: 0.05em;
  font-size: 0.55rem;
  font-weight: 500;
  padding: 3px 8px;
  text-transform: uppercase;
}
.leech-tip {
  margin-top: 12px;
  padding: 9px 12px;
  border-radius: 9px;
  background: var(--warn-soft);
  border: 1px solid var(--warn-line);
  color: var(--warn);
  font-size: 0.76rem;
  line-height: 1.5;
  text-align: left;
}
.buried-badge {
  position: absolute;
  top: 14px;
  right: 16px;
  font-family: var(--font-mono);
  background: var(--surface-2);
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  color: var(--ink-muted);
  letter-spacing: 0.05em;
  font-size: 0.55rem;
  font-weight: 500;
  padding: 3px 8px;
  text-transform: uppercase;
}
.buried-tip {
  margin-top: 12px;
  padding: 9px 12px;
  border-radius: 9px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--ink-muted);
  font-size: 0.76rem;
  line-height: 1.5;
  text-align: left;
}

/* ---------- Audio ---------- */

.speak-btn {
  position: absolute;
  bottom: 12px;
  right: 14px;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink-muted);
  font-size: 0.7rem;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.speak-btn:hover { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.speak-btn:active { transform: scale(0.94); }

/* ---------- Phone ---------- */

@media (max-width: 720px) {
  html, body { -webkit-text-size-adjust: 100%; }
  body { padding-bottom: calc(18px + env(safe-area-inset-bottom)); }

  header { padding: 0; }
  .header-inner { padding: 11px 16px calc(11px); }
  header h1 { font-size: 0.92rem; }
  header .subtitle { font-size: 0.78rem; }

  .tabs { padding: 14px 16px 12px; }
  .tab-btn { padding: 9px 16px; min-height: 40px; font-size: 0.84rem; }

  .filters { padding: 0 16px; }
  .stats-bar { padding: 0 16px; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
  .scope-bar { padding: 0 16px; margin-bottom: 14px; }
  .scope-legend { gap: 3px 10px; }
  .legend-item { font-size: 0.71rem; }
  .scope-note { margin-left: 0; }
  .filter-head { flex-wrap: wrap; gap: 4px 12px; }
  .mini { padding: 4px 8px; }
  .pill.has-meter { min-width: 86px; }
  .speak-btn { width: 34px; height: 34px; }
  .progress-track { width: 88px; }

  .card-area { padding: 0 16px 12px; }
  .card-wrapper, .card { min-height: 270px; }
  .card-face { padding: 30px 20px; border-radius: 16px; }
  .farsi-big { font-size: 2.05rem; }

  .nav-row { padding: 0 16px 8px; }
  .nav-btn { width: 40px; height: 40px; }

  .bottom-actions { padding: 0 16px 10px; flex-wrap: wrap; }
  .action-btn { min-height: 38px; }
  .shortcuts { display: none; }

  .score-row {
    position: sticky;
    bottom: 0;
    z-index: 5;
    max-width: none;
    margin: 0;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    gap: 7px;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-top: 1px solid var(--line);
  }
  .score-btn { min-width: 0; flex: 1; padding: 10px 6px; }
  .score-btn.show { min-width: 0; width: 100%; }
  .score-btn.bury, .score-btn.unbury {
    flex: 1 1 100%;
    flex-direction: row;
    gap: 8px;
    padding: 8px 10px;
  }

  .typed-input { font-size: 16px; max-width: none; }

  .filter-toggle {
    display: block;
    margin: 0 16px 12px;
    width: calc(100% - 32px);
    min-height: 42px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-muted);
    font-family: var(--font-sans);
    font-size: 0.83rem;
    font-weight: 500;
    box-shadow: var(--shadow-xs);
  }
  .phone-hint {
    display: block;
    max-width: 580px;
    margin: 0 auto 10px;
    padding: 0 16px;
    font-size: 0.72rem;
    color: var(--ink-light);
    text-align: center;
    line-height: 1.5;
  }
  .phone-hint[hidden] { display: none; }
  body.filters-collapsed #fc-filters,
  body.filters-collapsed #vt-filters { display: none !important; }
}

@media (hover: none) {
  .pill:hover, .tab-btn:hover, .action-btn:hover, .nav-btn:hover {
    background: inherit;
    border-color: var(--line);
    color: inherit;
  }
  .pill.active:hover { background: var(--text); border-color: var(--text); color: var(--bg); filter: none; }
  .tab-btn.active:hover { background: var(--surface); border-color: var(--line); }
  .card-wrapper:hover .card-face { border-color: var(--line); }
}

button, .pill, .tab-btn, .action-btn, .score-btn, .nav-btn {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="wordmark">
      <span class="mark" aria-hidden="true">ف</span>
      <h1>Farsi Flashcards</h1>
    </div>
    <div class="subtitle">پارسی را پاس بداریم</div>
  </div>
</header>

<div class="tabs">
  <div class="segmented" role="tablist">
    <button class="tab-btn active" id="tab-cards" role="tab" onclick="setTab('cards')">Flashcards</button>
    <button class="tab-btn" id="tab-verbs" role="tab" onclick="setTab('verbs')">Verb Trainer</button>
  </div>
</div>

function buildPills() {
  const mp = document.getElementById('mode-pills');
  mp.innerHTML = '';
  for (const m of studyModes) {
    const b = document.createElement('button');
    b.className = 'pill' + (studyMode === m.id ? ' active' : '');
    b.textContent = m.label;
    b.onclick = () => { studyMode = m.id; buildPills(); applyFilters(); };
    mp.appendChild(b);
  }
  const sp = document.getElementById('session-pills');
  sp.innerHTML = '';
  const perSession = sessionStateCounts();
  for (const s of sessions) {
    const b = document.createElement('button');
    b.className = 'pill has-meter' + (activeSessions.has(s.id) ? ' active' : '');
    const counts = perSession.get(s.id) || { new: 0, learning: 0, young: 0, mature: 0, total: 0 };
    b.innerHTML = `<span class="pill-text">${s.label}</span>` + meterHTML(counts);
    b.title = meterTitle(s.label, counts);
    b.onclick = () => { toggleSet(activeSessions, s.id); buildPills(); applyFilters(); };
    sp.appendChild(b);
  }
  const tp = document.getElementById('type-pills');
  tp.innerHTML = '';
  for (const t of types) {
    const b = document.createElement('button');
    b.className = 'pill' + (activeTypes.has(t.id) ? ' active' : '');
    b.textContent = t.label;
    b.onclick = () => { toggleSet(activeTypes, t.id); buildPills(); applyFilters(); };
    tp.appendChild(b);
  }
  const fp = document.getElementById('front-pills');
  fp.innerHTML = '';
  for (const f of frontModes) {
    const b = document.createElement('button');
    b.className = 'pill' + (frontMode === f.id ? ' active' : '');
    b.textContent = f.label;
    b.onclick = () => { frontMode = f.id; buildPills(); render(); };
    fp.appendChild(b);
  }
  const dp = document.getElementById('dir-pills');
  dp.innerHTML = '';
  for (const d of directions) {
    const b = document.createElement('button');
    b.className = 'pill' + (activeDirection === d.id ? ' active' : '');
    b.textContent = d.label;
    b.onclick = () => { activeDirection = d.id; buildPills(); applyFilters(); };
    dp.appendChild(b);
  }
}

function toggleSet(set, val) {
  if (set.has(val)) set.delete(val); else set.add(val);
}

function isBuried(c) {
  return !!(store.buried && store.buried[cardKey(c)]);
}

// Session / type / direction only — bury and mastery are layered on top.
function matchesFilters(c) {
  if (!activeSessions.has(c.session)) return false;
  if (!activeTypes.has(c.type)) return false;
  if (c.type === 'vocabulary' && activeDirection !== 'both' && c.direction !== activeDirection) return false;
  return true;
}

// Everything the current filters allow, ignoring the hide-mastered toggle —
// the state breakdown should stay honest about cards you have already banked.
function inScopeBase(c) {
  if (!matchesFilters(c)) return false;
  const buried = isBuried(c);
  return studyMode === 'buried' ? buried : !buried;
}

function inScope(c) {
  if (!inScopeBase(c)) return false;
  if (hideMastered && isMastered(c)) return false;
  return true;
}

// Spreads the day's new cards evenly through the due cards (interleaving beats blocking)
function interleave(due, fresh) {
  if (!fresh.length) return due.slice();
  if (!due.length) return fresh.slice();
  const out = [];
  const gap = due.length / fresh.length;
  let n = 0;
  for (let i = 0; i < due.length; i++) {
    out.push(due[i]);
    while (n < fresh.length && (n + 1) * gap <= i + 1) out.push(fresh[n++]);
  }
  while (n < fresh.length) out.push(fresh[n++]);
  return out;
}

function scopeStats() {
  const now = Date.now();
  let due = 0, fresh = 0, later = 0;
  for (const c of CARDS) {
    if (!inScope(c)) continue;
    const st = srsOf(c);
    if (!st) fresh++;
    else if (st.due <= now) due++;
    else later++;
  }
  return { due, fresh, later };
}

// Two directions of one word are the same fact. Seeing فردا → tomorrow makes
// tomorrow → فردا a freebie if it lands right behind it, so push siblings apart.
const SIBLING_GAP = 8;

function siblingKey(c) {
  return c.type === 'alphabet' ? `alpha|${c.name}` : `${c.session}|${c.type}|${c.farsi}`;
}

function spaceSiblings(list, gap) {
  const out = [];
  const held = [];
  const lastAt = new Map();
  const place = c => { lastAt.set(siblingKey(c), out.length); out.push(c); };
  const clear = c => {
    const i = lastAt.get(siblingKey(c));
    return i === undefined || out.length - i >= gap;
  };
  for (const c of list) {
    if (clear(c)) place(c); else held.push(c);
    for (let i = 0; i < held.length; i++) {
      if (clear(held[i])) { place(held.splice(i, 1)[0]); i--; }
    }
  }
  for (const c of held) place(c);   // no room left — take the collision
  return out;
}

function applyFilters() {
  const base = CARDS.filter(inScope);
  const now = Date.now();
  if (studyMode === 'all' || studyMode === 'buried') {
    queue = base.slice();
    if (shuffled) shuffle(queue);
  } else if (studyMode === 'weak') {
    // Deliberate remediation: everything you have lapsed on or that FSRS rates
    // as hard, worst first, regardless of whether it happens to be due.
    queue = base.filter(isWeak);
    queue.sort((a, b) => {
      const x = srsOf(a), y = srsOf(b);
      return (y.lapses - x.lapses) || (y.d - x.d);
    });
    if (shuffled) shuffle(queue);
  } else {
    const due = [], fresh = [];
    for (const c of base) {
      const st = srsOf(c);
      if (!st) fresh.push(c);
      else if (st.due <= now) due.push(c);
    }
    due.sort((a, b) => srsOf(a).due - srsOf(b).due);
    if (shuffled) { shuffle(due); shuffle(fresh); }
    const allowance = Math.max(0, newPerDay - newToday());
    queue = interleave(due, fresh.slice(0, allowance));
  }
  if (activeDirection === 'both') queue = spaceSiblings(queue, SIBLING_GAP);
  reviewedCount = 0;
  idx = 0;
  flipped = false;
  typedResult = null;
  typedValue = '';
  render();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function nextDueLabel() {
  const now = Date.now();
  let min = Infinity;
  for (const c of CARDS) {
    if (!inScope(c)) continue;
    const st = srsOf(c);
    if (st && st.due > now && st.due < min) min = st.due;
  }
  return min === Infinity ? null : fmtIvl(min - now);
}

function statsLine() {
  if (studyMode === 'buried') {
    return `<strong>${queue.length}</strong> buried &middot; hidden from study`;
  }
  const s = scopeStats();
  const streak = studyStreak();
  return `<strong>${queue.length}</strong> left &middot; ${s.due} due &middot; ${s.fresh} new`
    + ` &middot; <span class="stat-today">${revToday()} today</span>`
    + (streak > 1 ? ` &middot; <span class="stat-streak">${streak}-day streak</span>` : '');
}

function escAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderCards() {
  const area = document.getElementById('card-area');
  if (queue.length === 0) {
    const s = scopeStats();
    let msg;
    if (studyMode === 'buried') {
      msg = reviewedCount > 0
        ? `<div class="empty-state"><h2>Done for now</h2><p>Restored ${reviewedCount} card${reviewedCount === 1 ? '' : 's'}.</p></div>`
        : '<div class="empty-state"><h2>Nothing buried</h2><p>Bury a card to hide it from study. It stays gone until you unbury it here.</p></div>';
    } else if (reviewedCount > 0) {
      const nd = nextDueLabel();
      msg = `<div class="empty-state"><h2>Done for now</h2><p>${reviewedCount} card${reviewedCount === 1 ? '' : 's'} reviewed.`
        + (s.fresh ? ` ${s.fresh} new card${s.fresh === 1 ? '' : 's'} waiting behind today's limit of ${newPerDay}.` : '')
        + (nd ? ` Next review in ${nd}.` : '') + '</p></div>';
    } else if (s.fresh || s.later) {
      const nd = nextDueLabel();
      msg = `<div class="empty-state"><h2>All caught up</h2><p>Nothing is due right now.`
        + (nd ? ` Next review in ${nd}.` : '')
        + (s.fresh ? ` ${s.fresh} unseen card${s.fresh === 1 ? '' : 's'} left — raise New/day or switch to All cards to get ahead.` : '')
        + '</p></div>';
    } else {
      const buriedN = countBuried();
      msg = buriedN
        ? `<div class="empty-state"><h2>No cards match</h2><p>${buriedN} buried card${buriedN === 1 ? '' : 's'} hidden from study. Open Buried to restore one.</p></div>`
        : '<div class="empty-state"><h2>No cards match</h2><p>Adjust the filters above</p></div>';
    }
    area.innerHTML = msg;
    document.getElementById('nav-pos').textContent = '0 / 0';
    document.getElementById('card-count').innerHTML = statsLine();
    document.getElementById('progress-fill').style.width = reviewedCount > 0 ? '100%' : '0%';
    document.getElementById('progress-text').textContent = `${reviewedCount}`;
    return;
  }
  if (idx >= queue.length) idx = queue.length - 1;
  if (idx < 0) idx = 0;
  area.innerHTML = `<div class="card-wrapper" onclick="flipCard()"><div class="card${flipped?' flipped':''}" id="card"><div class="card-face card-front" id="card-front"></div><div class="card-face card-back" id="card-back"></div></div></div>`;

  const c = queue[idx];
  const front = document.getElementById('card-front');
  const back = document.getElementById('card-back');

  if (c.type === 'alphabet') {
    const tag = 'ALPHABET';
    if (frontMode === 'pinglish') {
      front.innerHTML = `<span class="card-tag">${tag}</span><div class="front-content"><div class="english-big">${c.name}</div><div class="pinglish" style="margin-top:8px">Sound: ${c.sound}</div></div><span class="tap-hint">tap to reveal</span>`;
    } else {
      front.innerHTML = `<span class="card-tag">${tag}</span><div class="front-content"><div class="farsi-big" style="font-size:5rem">${c.isolated}</div></div><span class="tap-hint">tap to reveal</span>`;
    }
    back.innerHTML = `<span class="card-tag">${tag}</span><div class="back-content"><div class="meaning">${c.name}</div><div class="pinglish">Sound: ${c.sound}</div><div class="letter-forms"><div class="letter-form-cell"><div class="form-label">Isolated</div><div class="form-char">${c.isolated}</div></div><div class="letter-form-cell"><div class="form-label">Initial</div><div class="form-char">${c.initial}</div></div><div class="letter-form-cell"><div class="form-label">Medial</div><div class="form-char">${c.medial}</div></div><div class="letter-form-cell"><div class="form-label">Final</div><div class="form-char">${c.final}</div></div></div><div class="breakdown">${c.notes}</div></div>`;
  } else if (c.direction === 'english-to-farsi') {
    const tag = `${c.session} / ${c.type} / EN\u2192FA`;
    front.innerHTML = `<span class="card-tag">${tag}</span><div class="front-content"><div class="english-big">${c.english}</div></div><span class="tap-hint">tap to reveal</span>`;
    back.innerHTML = `<span class="card-tag">${tag}</span><div class="back-content"><div class="farsi-answer">${c.farsi}</div><div class="pinglish">${c.pinglish}</div><div class="breakdown">${c.breakdown}</div></div>`;
  } else {
    const tag = `${c.session} / ${c.type}`;
    if (frontMode === 'pinglish') {
      front.innerHTML = `<span class="card-tag">${tag}</span><div class="front-content"><div class="english-big" style="font-size:1.8rem;font-style:italic;color:var(--blue)">${c.pinglish}</div></div><span class="tap-hint">tap to reveal</span>`;
      back.innerHTML = `<span class="card-tag">${tag}</span><div class="back-content"><div class="farsi-answer">${c.farsi}</div><div class="meaning">${c.english}</div><div class="breakdown">${c.breakdown}</div></div>`;
    } else {
      front.innerHTML = `<span class="card-tag">${tag}</span><div class="front-content"><div class="farsi-big">${c.farsi}</div></div><span class="tap-hint">tap to reveal</span>`;
      back.innerHTML = `<span class="card-tag">${tag}</span><div class="back-content"><div class="farsi-answer">${c.farsi}</div><div class="pinglish">${c.pinglish}</div><div class="meaning">${c.english}</div><div class="breakdown">${c.breakdown}</div></div>`;
    }
  }

  if (typedRecallActive(c)) {
    const hint = c.direction === 'english-to-farsi' ? 'type it in pinglish\u2026' : 'read it aloud, then type the pinglish\u2026';
    front.insertAdjacentHTML('beforeend',
      `<input id="typed-input" class="typed-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"`
      + ` placeholder="${hint}" value="${escAttr(typedValue)}" onclick="event.stopPropagation()" onkeydown="typedKey(event)">`);
    if (typedResult) {
      const ok = typedResult === 'right';
      back.insertAdjacentHTML('beforeend',
        `<div class="typed-banner ${typedResult}">${ok ? '\u2713 correct' : '\u2717 you typed \u201C' + escAttr(typedValue || '\u2014') + '\u201D'}</div>`);
    }
  }

  if (isBuried(c)) {
    front.insertAdjacentHTML('beforeend', '<span class="buried-badge">buried</span>');
    back.insertAdjacentHTML('beforeend', '<span class="buried-badge">buried</span>');
    const body = back.querySelector('.back-content');
    if (body) body.insertAdjacentHTML('beforeend',
      '<div class="buried-tip">Hidden from study. Unbury it if you want this card to come back.</div>');
  } else if (isMastered(c)) {
    front.insertAdjacentHTML('beforeend', '<span class="mastered-badge">mastered</span>');
    back.insertAdjacentHTML('beforeend', '<span class="mastered-badge">mastered</span>');
  } else if (isLeech(c)) {
    const badge = `<span class="leech-badge">leech &middot; ${srsOf(c).lapses} lapses</span>`;
    front.insertAdjacentHTML('beforeend', badge);
    back.insertAdjacentHTML('beforeend', badge);
    const body = back.querySelector('.back-content');
    if (body) body.insertAdjacentHTML('beforeend',
      '<div class="leech-tip">You keep losing this one. Another repetition will not fix it \u2014 '
      + 'build a mnemonic, say it out loud, or break it into a smaller piece.</div>');
  }

  if (ttsReady() && speakableText(c)) {
    back.insertAdjacentHTML('beforeend',
      '<button type="button" class="speak-btn" title="Hear it (s)" aria-label="Hear it"'
      + ' onclick="event.stopPropagation();speakCurrent()">\u25B6</button>');
  }

  const st = srsOf(c);
  document.getElementById('nav-pos').textContent = st
    ? `seen ${st.reps}\u00D7`
    : 'new card';
  document.getElementById('prev-btn').disabled = idx === 0;
  document.getElementById('next-btn').disabled = idx >= queue.length - 1;
  document.getElementById('card-count').innerHTML = statsLine();

  const total = reviewedCount + queue.length;
  const pct = total > 0 ? Math.round((reviewedCount / total) * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${reviewedCount}/${total}`;

  const input = document.getElementById('typed-input');
  if (input && !flipped) input.focus();

  if (flipped) maybeSpeak();
}

function typedRecallActive(c) {
  if (!typedMode || !c || c.type === 'alphabet' || frontMode === 'pinglish') return false;
  // Skip rule-of-thumb cards whose "pinglish" is an explanation rather than a word to type
  return !/[=\u0600-\u06FF]/.test(c.pinglish);
}

// Tolerant match: ignores case, macrons, punctuation and the usual oo/u, ee/i, q/gh swaps
function normalizePin(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]/g, '')
    .replace(/ou|oo/g, 'u')
    .replace(/ee/g, 'i')
    .replace(/ey/g, 'ei')
    .replace(/q/g, 'gh');
}
function pinMatches(input, answer) {
  const t = normalizePin(input);
  if (!t) return false;
  if (normalizePin(answer) === t) return true;
  return String(answer).split(/[\/,;]/).some(a => normalizePin(a) === t);
}

function typedKey(e) {
  e.stopPropagation();
  if (e.key !== 'Enter') return;
  e.preventDefault();
  typedValue = e.target.value;
  typedResult = pinMatches(typedValue, queue[idx].pinglish) ? 'right' : 'wrong';
  flipped = true;
  render();
}

function flipCard() {
  if (!flipped && tab === 'cards' && queue.length && typedRecallActive(queue[idx])) {
    const el = document.getElementById('typed-input');
    if (el && el.value.trim()) {
      typedValue = el.value;
      typedResult = pinMatches(typedValue, queue[idx].pinglish) ? 'right' : 'wrong';
      flipped = true;
      render();
      return;
    }
  }
  flipped = !flipped;
  const card = document.getElementById('card');
  if (card) card.classList.toggle('flipped', flipped);
  renderScoreRow();
  if (flipped) maybeSpeak();
}

function next() {
  if (tab === 'verbs') {
    if (vtMode === 'browse') {
      if (vIdx < browseVerbs().length - 1) { vIdx++; flipped = false; render(); }
    } else {
      newDrillPrompt(); flipped = false; render();
    }
    return;
  }
  if (idx < queue.length - 1) { idx++; flipped = false; typedResult = null; typedValue = ''; render(); }
}
function prev() {
  if (tab === 'verbs') {
    if (vtMode === 'browse' && vIdx > 0) { vIdx--; flipped = false; render(); }
    return;
  }
  if (idx > 0) { idx--; flipped = false; typedResult = null; typedValue = ''; render(); }
}

function toggleShuffle() {
  shuffled = !shuffled;
  document.getElementById('shuffle-btn').classList.toggle('active', shuffled);
  applyFilters();
}

function resetProgress() {
  const base = CARDS.filter(matchesFilters);
  const hasSaved = base.some(c => store.srs[cardKey(c)] || isBuried(c));
  if (hasSaved && !confirm('Reset the review schedule for the cards in this view? They go back to being brand new, and any buried cards come back.')) return;
  for (const c of base) {
    const k = cardKey(c);
    delete store.srs[k];
    delete store.mastery[k];
    if (store.buried) delete store.buried[k];
  }
  applyFilters();
}

// Cards tab: FSRS grading. 1 again, 2 hard, 3 good, 4 easy.
function gradeCard(g) {
  if (tab !== 'cards' || !queue.length) return;
  if (!flipped) { flipCard(); return; }
  const c = queue[idx];
  const k = cardKey(c);
  const prev = store.srs[k];
  const now = Date.now();
  if (!prev) bumpNewToday();
  bumpRevToday();
  const st = fsrsReview(prev, g, now);
  store.srs[k] = st;
  if (store.buried) delete store.buried[k];
  reviewedCount++;
  queue.splice(idx, 1);
  if (st.due - now <= SITTING_MS && studyMode !== 'buried') {
    const pos = Math.min(queue.length, idx + 3 + Math.floor(Math.random() * 4));
    queue.splice(pos, 0, c);
  }
  if (idx >= queue.length) idx = 0;
  flipped = false;
  typedResult = null;
  typedValue = '';
  render();
}

// Verb drill keeps the simple right/wrong scoring
function markCard(known) {
  if (tab !== 'verbs' || vtMode !== 'drill' || !drillPrompt) return;
  if (!flipped) flipCard();
  setTimeout(() => {
    const k = drillKey(drillPrompt);
    const st = store.drill[k] || { r: 0, w: 0 };
    if (known) { st.r++; drillRight++; } else { st.w++; drillWrong++; }
    store.drill[k] = st;
    newDrillPrompt();
    flipped = false;
    render();
  }, 200);
}

const GRADES = [
  { g: 1, label: 'Again', cls: 'again' },
  { g: 2, label: 'Hard', cls: 'hard' },
  { g: 3, label: 'Good', cls: 'know' },
  { g: 4, label: 'Easy', cls: 'easy' },
];

function buryBtnHTML() {
  return isBuried(queue[idx])
    ? '<button class="score-btn unbury" onclick="unburyCard()"><span>Unbury</span><span class="score-sub">restore</span></button>'
    : '<button class="score-btn bury" onclick="buryCard()"><span>Bury</span><span class="score-sub">hide</span></button>';
}

function buryCard() {
  if (tab !== 'cards' || !queue.length) return;
  const c = queue[idx];
  if (isBuried(c)) return;
  if (!store.buried) store.buried = {};
  store.buried[cardKey(c)] = Date.now();
  reviewedCount++;
  queue.splice(idx, 1);
  if (idx >= queue.length) idx = 0;
  flipped = false;
  typedResult = null;
  typedValue = '';
  render();
}

function unburyCard() {
  if (tab !== 'cards' || !queue.length) return;
  const c = queue[idx];
  if (!isBuried(c)) return;
  delete store.buried[cardKey(c)];
  queue.splice(idx, 1);
  if (idx >= queue.length) idx = 0;
  flipped = false;
  typedResult = null;
  typedValue = '';
  render();
}

function renderScoreRow() {
  const row = document.getElementById('score-row');
  if (!row) return;
  if (tab === 'verbs') {
    row.innerHTML = vtMode === 'drill'
      ? '<button class="score-btn again" onclick="markCard(false)">Again</button>'
        + '<button class="score-btn know" onclick="markCard(true)">Got it</button>'
      : '';
    return;
  }
  if (!queue.length) { row.innerHTML = ''; return; }
  if (!flipped) {
    row.innerHTML = '<button class="score-btn show" onclick="flipCard()">Show answer</button>' + buryBtnHTML();
    return;
  }
  const prev = store.srs[cardKey(queue[idx])];
  const now = Date.now();
  row.innerHTML = GRADES.map(({ g, label, cls }) => {
    const st = fsrsReview(prev, g, now, true);
    const suggest = typedResult === 'wrong' && g === 1 ? ' suggest' : '';
    return `<button class="score-btn ${cls}${suggest}" onclick="gradeCard(${g})">`
      + `<span>${label}</span><span class="score-sub">${fmtIvl(st.due - now)}</span></button>`;
  }).join('') + buryBtnHTML();
}

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); flipCard(); }
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
  if (e.key === 's' || e.key === 'S') speakCurrent();
  if (tab === 'verbs') {
    if (e.key === '1') markCard(false);
    if (e.key === '2') markCard(true);
  } else if (e.key >= '1' && e.key <= '4') {
    gradeCard(Number(e.key));
  } else if (e.key === 'b' || e.key === 'B') {
    if (queue.length && isBuried(queue[idx])) unburyCard();
    else buryCard();
  }
});

// ===== Local storage persistence =====
const LS_KEY = 'farsi-flashcards-v1';
let store = { prefs: {}, mastery: {}, drill: {}, srs: {}, buried: {}, newLog: {}, revLog: {}, migratedV2: false };
try {
  const saved = JSON.parse(localStorage.getItem(LS_KEY));
  if (saved && typeof saved === 'object') {
    store.prefs = saved.prefs || {};
    store.mastery = saved.mastery || {};
    store.drill = saved.drill || {};
    store.srs = saved.srs || {};
    store.buried = saved.buried || {};
    store.newLog = saved.newLog || {};
    store.revLog = saved.revLog || {};
    store.migratedV2 = !!saved.migratedV2;
  }
} catch (e) {}

function persistStore() {
  store.prefs = {
    sessions: [...activeSessions],
    knownSessions: sessions.map(s => s.id),
    types: [...activeTypes],
    knownTypes: types.map(t => t.id),
    direction: activeDirection,
    frontMode: frontMode,
    shuffled: shuffled,
    hideMastered: hideMastered,
    studyMode: studyMode,
    newPerDay: newPerDay,
    typedMode: typedMode,
    audioMode: audioMode,
    filtersExpanded: filtersExpanded,
    tab: tab,
    vtMode: vtMode,
    tenses: [...activeTenses],
    knownTenses: TENSES.map(t => t.id),
    verbsOff: VERBS.filter(v => !activeVerbs.has(v.id)).map(v => v.id),
  };
  try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {}
}

function cardKey(c) {
  return c.type === 'alphabet' ? `alpha|${c.name}` : `${c.session}|${c.type}|${c.direction}|${c.farsi}`;
}

// ===== FSRS-6 scheduler (default parameters from open-spaced-repetition/py-fsrs) =====
const FSRS_W = [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722,
                0.1666, 0.796, 1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425,
                0.0912, 0.0658, 0.1542];
const FSRS_DECAY = -FSRS_W[20];
const FSRS_FACTOR = Math.pow(0.9, 1 / FSRS_DECAY) - 1;
const DESIRED_RETENTION = 0.9;   // 90% — the standard target; higher means more reviews
const LEARN_STEPS = [1, 10];     // minutes, same-day steps for a brand new card
const RELEARN_STEPS = [10];      // minutes, after a lapse
const MAX_INTERVAL = 36500;      // days
const MIN_MS = 60000;
const DAY_MS = 86400000;
const MATURE_DAYS = 21;          // a card counts as "mastered" once it survives 3 weeks
const SITTING_MS = 20 * MIN_MS;  // cards due sooner than this come back in this session

const clampD = d => Math.min(Math.max(d, 1), 10);
const clampS = s => Math.max(s, 0.001);

function fsrsRetrievability(s, elapsedDays) {
  return Math.pow(1 + FSRS_FACTOR * elapsedDays / s, FSRS_DECAY);
}
function fsrsInitDifficulty(g) { return FSRS_W[4] - Math.exp(FSRS_W[5] * (g - 1)) + 1; }
function fsrsNextDifficulty(d, g) {
  const delta = -(FSRS_W[6] * (g - 3));
  const damped = d + (10 - d) * delta / 9;
  return clampD(FSRS_W[7] * fsrsInitDifficulty(4) + (1 - FSRS_W[7]) * damped);
}
function fsrsShortTermStability(s, g) {
  let inc = Math.exp(FSRS_W[17] * (g - 3 + FSRS_W[18])) * Math.pow(s, -FSRS_W[19]);
  if (g >= 2) inc = Math.max(inc, 1);
  return clampS(s * inc);
}
function fsrsRecallStability(d, s, r, g) {
  const hard = g === 2 ? FSRS_W[15] : 1;
  const easy = g === 4 ? FSRS_W[16] : 1;
  return clampS(s * (1 + Math.exp(FSRS_W[8]) * (11 - d) * Math.pow(s, -FSRS_W[9])
    * (Math.exp((1 - r) * FSRS_W[10]) - 1) * hard * easy));
}
function fsrsForgetStability(d, s, r) {
  const long = FSRS_W[11] * Math.pow(d, -FSRS_W[12]) * (Math.pow(s + 1, FSRS_W[13]) - 1)
    * Math.exp((1 - r) * FSRS_W[14]);
  const short = s / Math.exp(FSRS_W[17] * FSRS_W[18]);
  return clampS(Math.min(long, short));
}
function fsrsInterval(s) {
  const days = (s / FSRS_FACTOR) * (Math.pow(DESIRED_RETENTION, 1 / FSRS_DECAY) - 1);
  return Math.min(Math.max(Math.round(days), 1), MAX_INTERVAL);
}
// Spreads same-day piles apart so reviews don't clump on one date
function fuzzInterval(days) {
  if (days < 2.5) return days;
  let delta = 1;
  delta += 0.15 * Math.max(Math.min(days, 7) - 2.5, 0);
  delta += 0.10 * Math.max(Math.min(days, 20) - 7, 0);
  delta += 0.05 * Math.max(days - 20, 0);
  const lo = Math.max(2, Math.round(days - delta));
  const hi = Math.min(MAX_INTERVAL, Math.max(lo, Math.round(days + delta)));
  return lo + Math.floor(Math.random() * (hi - lo + 1));
}

// Grades: 1 again, 2 hard, 3 good, 4 easy. Returns the new memory state (pure).
function fsrsReview(prev, g, now, noFuzz) {
  const st = prev
    ? { d: prev.d, s: prev.s, due: prev.due, last: prev.last, state: prev.state, step: prev.step || 0, reps: prev.reps || 0, lapses: prev.lapses || 0 }
    : { d: 0, s: 0, due: now, last: now, state: 'learning', step: 0, reps: 0, lapses: 0 };
  const graduate = () => {
    const days = fsrsInterval(st.s);
    return (noFuzz ? days : fuzzInterval(days)) * DAY_MS;
  };
  if (!prev) {
    st.s = clampS(FSRS_W[g - 1]);
    st.d = clampD(fsrsInitDifficulty(g));
  } else {
    const elapsed = Math.max(0, (now - st.last) / DAY_MS);
    if (elapsed < 1) {
      st.s = fsrsShortTermStability(st.s, g);
    } else {
      const r = fsrsRetrievability(st.s, elapsed);
      st.s = g === 1 ? fsrsForgetStability(st.d, st.s, r) : fsrsRecallStability(st.d, st.s, r, g);
    }
    st.d = fsrsNextDifficulty(st.d, g);
  }

  let interval;
  if (st.state === 'review') {
    if (g === 1) { st.lapses++; st.state = 'relearning'; st.step = 0; interval = RELEARN_STEPS[0] * MIN_MS; }
    else interval = graduate();
  } else {
    const steps = st.state === 'relearning' ? RELEARN_STEPS : LEARN_STEPS;
    if (g === 1) { st.step = 0; interval = steps[0] * MIN_MS; }
    else if (g === 2) {
      const next = st.step + 1 < steps.length ? (steps[st.step] + steps[st.step + 1]) / 2 : steps[st.step] * 1.5;
      interval = next * MIN_MS;
    } else if (g === 3) {
      st.step++;
      if (st.step >= steps.length) { st.state = 'review'; st.step = 0; interval = graduate(); }
      else interval = steps[st.step] * MIN_MS;
    } else {
      st.state = 'review'; st.step = 0; interval = graduate();
    }
  }
  st.reps++;
  st.last = now;
  st.due = now + interval;
  return st;
}

function fmtIvl(ms) {
  const mins = ms / MIN_MS;
  if (mins < 60) return Math.max(1, Math.round(mins)) + 'm';
  const hours = mins / 60;
  if (hours < 24) return Math.round(hours) + 'h';
  const days = hours / 24;
  if (days < 30) return Math.round(days) + 'd';
  const months = days / 30.44;
  if (months < 12) return (months < 2 ? months.toFixed(1) : Math.round(months)) + 'mo';
  return (days / 365.25).toFixed(1) + 'y';
}

function srsOf(c) { return store.srs[cardKey(c)]; }
function isMastered(c) {
  const st = srsOf(c);
  return !!st && st.state === 'review' && st.s >= MATURE_DAYS;
}
function masteredTotal() {
  let n = 0;
  for (const c of CARDS) if (isMastered(c)) n++;
  return n;
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}
function newToday() { return store.newLog[todayKey()] || 0; }
function bumpNewToday() { store.newLog[todayKey()] = newToday() + 1; }

// Carries pre-SRS streak progress over instead of throwing it away
function migrateLegacyMastery() {
  if (store.migratedV2 || !store.mastery) { store.migratedV2 = true; return; }
  const now = Date.now();
  for (const k of Object.keys(store.mastery)) {
    if (store.srs[k]) continue;
    const m = store.mastery[k] || {};
    const streak = Math.max(0, m.s || 0);
    if (!streak && !m.a) continue;
    const s = clampS(1 + 3 * streak);
    store.srs[k] = {
      d: clampD(6 - streak + 0.5 * (m.a || 0)),
      s,
      last: now,
      due: now + (0.25 + Math.random() * 0.6) * s * DAY_MS,
      state: streak > 0 ? 'review' : 'learning',
      step: 0,
      reps: streak + (m.a || 0),
      lapses: m.a || 0,
    };
  }
  store.migratedV2 = true;
}

// ===== Conjugation engine (colloquial Tehrani forms) =====
// Past stem = infinitive minus the final -an / -ن (true for every Persian verb)
function pastStem(v) {
  if (v.pastStem) return { pin: v.pastStem, fa: v.pastStemFa };
  const pinTok = v.pin.replace(/\s*\([^)]*\)\s*/g, ' ').trim().split(/\s+/).pop();
  const faTok = v.fa.trim().split(/\s+/).pop();
  return { pin: pinTok.replace(/an$/, ''), fa: faTok.replace(/\u0646$/, '') };
}

function conj(v, tense, pi) {
  if (tense === 'continuous') {
    if (v.noCont) return null;
    const base = conj(v, 'present', pi);
    return { pin: DARAM_PIN[pi] + ' ' + base.pin, fa: DARAM_FA[pi] + ' ' + base.fa };
  }
  if (tense === 'past' || tense === 'pastneg') {
    const neg = tense === 'pastneg';
    const ps = pastStem(v);
    const sPin = neg ? (v.negPast || ('na' + ps.pin)) : ps.pin;
    const sFa = neg ? (v.negPastFa || ('\u0646' + ps.fa)) : ps.fa;
    return {
      pin: (v.pre ? v.pre.pin + ' ' : '') + sPin + PAST_END_PIN[pi],
      fa: (v.pre ? v.pre.fa + ' ' : '') + sFa + PAST_END_FA[pi],
    };
  }
  if (v.irregular) {
    const p = tense === 'present' ? v.irregular.pres : v.irregular.neg;
    const f = tense === 'present' ? v.irregular.presFa : v.irregular.negFa;
    return { pin: p[pi], fa: f[pi] };
  }
  const end = (v.vowel ? END_PIN_V : END_PIN)[pi];
  const endFa = (v.vowel ? END_FA_V : END_FA)[pi];
  let core, coreFa;
  if (v.noMi) {
    core = (tense === 'negative' ? 'na' : '') + v.stem + end;
    coreFa = (tense === 'negative' ? '\u0646' : '') + v.stemFa + endFa;
  } else {
    core = (tense === 'negative' ? 'nemi' : 'mi') + v.stem + end;
    coreFa = (tense === 'negative' ? '\u0646\u0645\u06CC\u200C' : '\u0645\u06CC\u200C') + v.stemFa + endFa;
  }
  return {
    pin: (v.pre ? v.pre.pin + ' ' : '') + core,
    fa: (v.pre ? v.pre.fa + ' ' : '') + coreFa,
  };
}

function drillKey(d) { return `${d.v.id}|${d.tense}|${d.pi}`; }

function drillAnswer(d) {
  const v = d.v;
  if (d.tense === 'imperative' || d.tense === 'impneg') {
    const neg = d.tense === 'impneg';
    const pl = d.pi === 4;
    return {
      pin: neg ? (pl ? v.imp.negPl : v.imp.negSg) : (pl ? v.imp.pl : v.imp.sg),
      fa: neg ? (pl ? v.imp.negPlFa : v.imp.negSgFa) : (pl ? v.imp.plFa : v.imp.sgFa),
    };
  }
  return conj(v, d.tense, d.pi);
}

function drillBreakdown(d) {
  const v = d.v;
  if (d.tense === 'imperative') return 'imperative of ' + v.pin;
  if (d.tense === 'impneg') return 'negative imperative of ' + v.pin;
  if (d.tense === 'past' || d.tense === 'pastneg') {
    const ps = pastStem(v);
    const neg = d.tense === 'pastneg';
    const stem = neg ? (v.negPast || ('na + ' + ps.pin)) : ps.pin;
    const e = PAST_END_PIN[d.pi];
    let s = stem + (e ? ' + ' + e : ' + nothing (3rd person sing.)');
    if (v.pre) s = v.pre.pin + ' + ' + s;
    return s + '  \u2014  past stem: ' + ps.pin;
  }
  if (v.irregular) return v.pin + ' is irregular \u2014 memorize it!';
  const end = (v.vowel ? END_PIN_V : END_PIN)[d.pi];
  let s = v.noMi
    ? (d.tense === 'negative' ? 'na + ' : '') + v.stem + ' + ' + end
    : (d.tense === 'negative' ? 'nemi' : 'mi') + ' + ' + v.stem + ' + ' + end;
  if (v.pre) s = v.pre.pin + ' + ' + s;
  if (d.tense === 'continuous') s = DARAM_PIN[d.pi] + ' + ' + s;
  return s;
}

function browseVerbs() { return VERBS.filter(v => activeVerbs.has(v.id)); }

function newDrillPrompt() {
  const combos = [];
  for (const v of browseVerbs()) {
    for (const t of TENSES) {
      if (!activeTenses.has(t.id)) continue;
      if (t.id === 'continuous' && v.noCont) continue;
      if ((t.id === 'imperative' || t.id === 'impneg') && !v.imp) continue;
      const pis = (t.id === 'imperative' || t.id === 'impneg') ? [1, 4] : [0, 1, 2, 3, 4, 5];
      for (const pi of pis) combos.push({ v, tense: t.id, pi });
    }
  }
  if (!combos.length) { drillPrompt = null; return; }
  let total = 0;
  const weights = combos.map(c => {
    const st = store.drill[drillKey(c)] || { r: 0, w: 0 };
    let wgt = (1 + 2 * st.w) / (1 + st.r);
    if (drillPrompt && drillKey(c) === drillKey(drillPrompt)) wgt *= 0.05;
    total += wgt;
    return wgt;
  });
  let r = Math.random() * total;
  drillPrompt = combos[combos.length - 1];
  for (let i = 0; i < combos.length; i++) {
    r -= weights[i];
    if (r <= 0) { drillPrompt = combos[i]; break; }
  }
}

// ===== Verb trainer rendering =====
function conjCell(f) {
  return f
    ? `<span class="fa">${f.fa}</span><span class="pin">${f.pin}</span>`
    : '<span class="pin" style="opacity:.3">\u2014</span>';
}

function conjTableHTML(v) {
  let rows = '';
  for (let i = 0; i < 6; i++) {
    rows += `<tr><td class="person">${PERSONS[i].pin}</td><td>${conjCell(conj(v, 'present', i))}</td><td>${conjCell(conj(v, 'negative', i))}</td><td>${conjCell(conj(v, 'continuous', i))}</td></tr>`;
  }
  return `<table class="conj-table"><thead><tr><th></th><th>Present</th><th>Negative</th><th>Right now</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function pastTableHTML(v) {
  let rows = '';
  for (let i = 0; i < 6; i++) {
    rows += `<tr><td class="person">${PERSONS[i].pin}</td><td>${conjCell(conj(v, 'past', i))}</td><td>${conjCell(conj(v, 'pastneg', i))}</td></tr>`;
  }
  const ps = pastStem(v);
  return `<table class="conj-table" style="margin-top:14px"><thead><tr><th>past stem: ${ps.pin}</th><th>Past</th><th>Neg. past</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function impHTML(v) {
  if (!v.imp) return '';
  return `<div class="conj-imp">Do it! <strong>${v.imp.sg}</strong> <span class="fa-inline">${v.imp.sgFa}</span> &middot; <strong>${v.imp.pl}</strong> <span class="fa-inline">${v.imp.plFa}</span><br>Don't! <strong>${v.imp.negSg}</strong> <span class="fa-inline">${v.imp.negSgFa}</span> &middot; <strong>${v.imp.negPl}</strong> <span class="fa-inline">${v.imp.negPlFa}</span></div>`;
}

function renderDrill() {
  const area = document.getElementById('card-area');
  if (!drillPrompt) newDrillPrompt();
  if (!drillPrompt) {
    area.innerHTML = '<div class="empty-state"><h2>Nothing to drill</h2><p>Select at least one verb and one tense above</p></div>';
    document.getElementById('nav-pos').textContent = '\u2014';
    document.getElementById('prev-btn').disabled = true;
    document.getElementById('next-btn').disabled = true;
    document.getElementById('card-count').innerHTML = '';
    document.getElementById('progress-fill').style.width = '0%';
    document.getElementById('progress-text').textContent = '\u2014';
    return;
  }
  const d = drillPrompt, v = d.v;
  const t = TENSES.find(x => x.id === d.tense);
  const isImp = d.tense === 'imperative' || d.tense === 'impneg';
  const personLabel = isImp
    ? (d.pi === 4 ? 'shom\u0101 \u2014 you (pl/formal)' : 'to \u2014 you')
    : `${PERSONS[d.pi].pin} \u2014 ${PERSONS[d.pi].en}`;
  const ans = drillAnswer(d);
  area.innerHTML = `<div class="card-wrapper" onclick="flipCard()"><div class="card${flipped ? ' flipped' : ''}" id="card">
    <div class="card-face card-front">
      <span class="card-tag">VERB DRILL</span>

        <div class="drill-verb-pin">${v.pin}</div>
        <div class="drill-verb-en">${v.en}</div>
        <div class="drill-chips">
          <span class="chip person">${personLabel}</span>

        </div>
      </div>
      <span class="tap-hint">tap for answer</span>
    </div>
    <div class="card-face card-back">
      <span class="card-tag">VERB DRILL</span>
      <div class="back-content">
        <div class="farsi-answer">${ans.fa}</div>
        <div class="pinglish">${ans.pin}</div>
        <div class="meaning" style="font-size:1rem;color:var(--text-dim);font-weight:400">${personLabel} &middot; ${t.desc}</div>
        <div class="breakdown">${drillBreakdown(d)}</div>
      </div>

  const pct = tot ? Math.round(drillRight / tot * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = tot ? pct + '%' : '\u2014';
}

function syncChrome() {
  document.getElementById('tab-cards').classList.toggle('active', tab === 'cards');
  document.getElementById('tab-verbs').classList.toggle('active', tab === 'verbs');
  document.getElementById('fc-filters').style.display = tab === 'cards' ? '' : 'none';
  document.getElementById('vt-filters').style.display = tab === 'verbs' ? '' : 'none';
  document.querySelector('.bottom-actions').style.display = tab === 'cards' ? '' : 'none';
  document.getElementById('score-row').style.display = (tab === 'cards' || vtMode === 'drill') ? '' : 'none';
  document.body.classList.toggle('filters-collapsed', !filtersExpanded);
  const ft = document.getElementById('filter-toggle');
  if (ft) ft.textContent = filtersExpanded ? 'Hide filters' : 'Filters';
  const hint = document.getElementById('phone-hint');
  if (hint) {
    const standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    hint.hidden = standalone || window.innerWidth > 720;
  }
  document.getElementById('shortcuts').innerHTML = tab === 'cards'
    ? '<span><kbd>Space</kbd> show answer &nbsp; <kbd>1</kbd> again &nbsp; <kbd>2</kbd> hard &nbsp; <kbd>3</kbd> good &nbsp; <kbd>4</kbd> easy &nbsp; <kbd>b</kbd> bury &nbsp; <kbd>&#8594;</kbd> skip'
      + (ttsReady() ? ' &nbsp; <kbd>s</kbd> hear it' : '') + '</span>'
    : '<span><kbd>Space</kbd> flip &nbsp; <kbd>&#8592;</kbd><kbd>&#8594;</kbd> navigate &nbsp; <kbd>1</kbd> again &nbsp; <kbd>2</kbd> got it</span>';
}

  }
  document.getElementById('vt-tense-group').style.display = vtMode === 'drill' ? '' : 'none';
  const tp = document.getElementById('vt-tense-pills');
  tp.innerHTML = '';
  for (const t of TENSES) {
    const b = document.createElement('button');

    b.textContent = t.label;
    b.onclick = () => { toggleSet(activeTenses, t.id); drillPrompt = null; newDrillPrompt(); buildVtPills(); render(); };

  }
  const vp = document.getElementById('vt-verb-pills');
  vp.innerHTML = '';

  allBtn.style.borderStyle = 'dashed';

    if (activeVerbs.size === VERBS.length) activeVerbs.clear();
    else for (const v of VERBS) activeVerbs.add(v.id);
    vIdx = 0; drillPrompt = null; newDrillPrompt(); buildVtPills(); render();
  };
