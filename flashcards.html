  for (const v of VERBS) {
    const b = document.createElement('button');
    b.className = 'pill' + (activeVerbs.has(v.id) ? ' active' : '');
    b.textContent = v.pin;
    b.onclick = () => { toggleSet(activeVerbs, v.id); vIdx = 0; drillPrompt = null; newDrillPrompt(); buildVtPills(); render(); };
    vp.appendChild(b);
  }
}

// ===== Card states, breakdown meters, filters, audio =====

// The four states every SRS reports on. Order is "most learned first" so the
// meters read as a progress bar filling from the left.
const STATES = [
  { id: 'mature',   label: 'Mature',   hint: 'stable for 21+ days' },
  { id: 'young',    label: 'Young',    hint: 'in review, still consolidating' },
  { id: 'learning', label: 'Learning', hint: 'in a learning or relearning step' },
  { id: 'new',      label: 'New',      hint: 'not seen yet' },
];

function cardState(c) {
  const st = srsOf(c);
  if (!st) return 'new';
  if (st.state === 'learning' || st.state === 'relearning') return 'learning';
  return st.s >= MATURE_DAYS ? 'mature' : 'young';
}

function emptyCounts() {
  return { new: 0, learning: 0, young: 0, mature: 0, total: 0 };
}

// Per session, honouring the type and direction filters but not the session
// filter itself — otherwise every pill you switch off would read as empty.
function sessionStateCounts() {
  const m = new Map();
  for (const c of CARDS) {
    if (!activeTypes.has(c.type)) continue;
    if (c.type === 'vocabulary' && activeDirection !== 'both' && c.direction !== activeDirection) continue;
    if (isBuried(c)) continue;
    let e = m.get(c.session);
    if (!e) m.set(c.session, e = emptyCounts());
    e[cardState(c)]++;
    e.total++;
  }
  return m;
}

function scopeStateCounts() {
  const e = emptyCounts();
  for (const c of CARDS) {
    if (!inScopeBase(c)) continue;
    e[cardState(c)]++;
    e.total++;
  }
  return e;
}

function meterHTML(counts) {
  if (!counts.total) return '<span class="meter"></span>';
  const segs = STATES.filter(st => st.id !== 'new' && counts[st.id])
    .map(st => `<i class="seg seg-${st.id}" style="width:${(counts[st.id] / counts.total) * 100}%"></i>`)
    .join('');
  return `<span class="meter">${segs}</span>`;
}

function meterTitle(label, counts) {
  if (!counts.total) return `${label} — no cards under the current filters`;
  const parts = STATES.map(st => `${counts[st.id]} ${st.label.toLowerCase()}`);
  return `${label} — ${counts.total} cards: ${parts.join(', ')}`;
}

function renderScopeBar() {
  const el = document.getElementById('scope-bar');
  if (!el) return;
  if (tab !== 'cards') { el.innerHTML = ''; return; }

  const counts = scopeStateCounts();
  if (!counts.total) {
    el.innerHTML = '<div class="scope-empty">No cards selected — turn a session back on above.</div>';
    return;
  }

  const pct = id => (counts[id] / counts.total) * 100;
  const track = STATES.map(st =>
    counts[st.id] ? `<i class="scope-seg seg-${st.id}" style="width:${pct(st.id)}%"></i>` : '').join('');
  const legend = STATES.map(st =>
    `<span class="legend-item" title="${st.hint}">`
    + `<i class="dot seg-${st.id}"></i>${st.label}`
    + `<b>${counts[st.id]}</b>`
    + `<span class="legend-pct">${Math.round(pct(st.id))}%</span></span>`).join('');

  const leeches = countLeeches();
  const buriedN = countBuried();
  const notes = [];
  if (leeches) {
    notes.push(`<button type="button" class="scope-note" onclick="studyWeakSpots()">`
      + `${leeches} leech${leeches === 1 ? '' : 'es'} — study weak spots</button>`);
  }
  if (buriedN) {
    notes.push(`<button type="button" class="scope-note" onclick="studyBuried()">`
      + `${buriedN} buried</button>`);
  }
  const note = notes.join('');

  el.innerHTML = `<div class="scope-track">${track}</div>`
    + `<div class="scope-legend">${legend}${note}</div>`;
}


// ===== Bulk filter actions =====

function setAllSessions(on) {
  activeSessions = on ? new Set(sessions.map(x => x.id)) : new Set();
  buildPills();
  applyFilters();
}

function setAllTypes(on) {
  activeTypes = on ? new Set(types.map(t => t.id)) : new Set();
  buildPills();
  applyFilters();
}

// "Newest" means the last numbered session in the list, not the alphabet.
function onlyNewestSession() {
  const numbered = sessions.filter(x => x.id !== 'alphabet');
  const newest = numbered[numbered.length - 1];
  if (!newest) return;
  activeSessions = new Set([newest.id]);
  buildPills();
  applyFilters();
}


// ===== Leeches and weak spots =====

// Anki flags a card at 8 lapses; 6 catches them a little earlier, which is
// what you want when the fix is to re-encode rather than to keep drilling.
const LEECH_LAPSES = 6;
const HARD_DIFFICULTY = 7;   // FSRS difficulty runs 1-10

function isLeech(c) {
  const st = srsOf(c);
  return !!st && st.lapses >= LEECH_LAPSES;
}

function isWeak(c) {
  const st = srsOf(c);
  return !!st && (st.lapses > 0 || st.d >= HARD_DIFFICULTY);
}

function countLeeches() {
  let n = 0;
  for (const c of CARDS) if (inScopeBase(c) && isLeech(c)) n++;
  return n;
}

function countBuried() {
  let n = 0;
  for (const c of CARDS) if (matchesFilters(c) && isBuried(c)) n++;
  return n;
}

function studyWeakSpots() {
  studyMode = 'weak';
  buildPills();
  applyFilters();
}

function studyBuried() {
  studyMode = 'buried';
  buildPills();
  applyFilters();
}


// ===== Daily activity and streak =====

function revToday() { return (store.revLog || {})[todayKey()] || 0; }

function bumpRevToday() {
  if (!store.revLog) store.revLog = {};
  store.revLog[todayKey()] = revToday() + 1;
}

function dayKeyOffset(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}

// Counts back from today. A day with no reviews yet does not break the streak
// until it is over, so an untouched morning still shows yesterday's run.
function studyStreak() {
  const log = store.revLog || {};
  let n = 0;
  let i = log[dayKeyOffset(0)] ? 0 : 1;
  while (log[dayKeyOffset(i)]) { n++; i++; }
  return n;
}

// The logs are keyed by day and only ever grow, so trim the old tail.
function pruneLogs() {
  const keep = new Set();
  for (let i = 0; i < 400; i++) keep.add(dayKeyOffset(i));
  for (const which of ['newLog', 'revLog']) {
    const log = store[which];
    if (!log) continue;
    for (const k of Object.keys(log)) if (!keep.has(k)) delete log[k];
  }
}


// ===== Text-to-speech =====
//
// Hearing a word while reading it is the cheapest win available here: the
// script and the sound get encoded together instead of separately. Only
// offered when the device actually has a Persian voice — without one the
// browser reads Farsi script as nonsense.

let faVoice = null;
let spokenFor = null;

function initVoices() {
  if (!('speechSynthesis' in window)) return;
  pickVoice();
  speechSynthesis.addEventListener('voiceschanged', () => {
    pickVoice();
    syncAudioBtn();
    if (tab === 'cards') render();
  });
}

function pickVoice() {
  let list = [];
  try { list = speechSynthesis.getVoices() || []; } catch (e) { return; }
  faVoice = list.find(v => /^fa\b|^fa[-_]/i.test(v.lang || '')) || null;
}

function ttsReady() { return !!faVoice; }

function speakableText(c) {
  if (!c || c.type === 'alphabet') return '';
  return c.farsi || '';
}

function speakFarsi(text) {
  if (!ttsReady() || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = faVoice.lang || 'fa-IR';
    // Some engines reject the voice object outright; the lang tag alone still
    // gets Persian out of them, so never let this take the utterance down.
    try { u.voice = faVoice; } catch (e) {}
    u.rate = 0.85;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function speakCurrent() {
  if (tab !== 'cards') return;
  speakFarsi(speakableText(queue[idx]));
}

// Auto-play fires once per reveal, not on every incidental re-render.
function maybeSpeak() {
  if (!audioMode || !ttsReady()) return;
  const c = queue[idx];
  if (!c) return;
  const token = cardKey(c) + '|' + reviewedCount;
  if (spokenFor === token) return;
  spokenFor = token;
  speakFarsi(speakableText(c));
}

function toggleAudio() {
  audioMode = !audioMode;
  syncAudioBtn();
  if (audioMode) speakCurrent();
  persistStore();
}

function syncAudioBtn() {
  const b = document.getElementById('audio-btn');
  if (!b) return;
  b.hidden = !ttsReady();
  b.classList.toggle('active', audioMode);
}

(function init() {
  const p = store.prefs || {};
  if (Array.isArray(p.sessions)) {
    activeSessions = new Set(p.sessions.filter(s => sessions.some(x => x.id === s)));
    const known = new Set(p.knownSessions || []);
    for (const s of sessions) if (!known.has(s.id)) activeSessions.add(s.id);
  }
  if (Array.isArray(p.types) && p.types.length) {
    activeTypes = new Set(p.types);
    const knownT = new Set(p.knownTypes || []);
    for (const t of types) if (!knownT.has(t.id)) activeTypes.add(t.id);
  }
  if (p.direction) activeDirection = p.direction;
  if (p.frontMode) frontMode = p.frontMode;
  if (typeof p.shuffled === 'boolean') shuffled = p.shuffled;
  if (typeof p.hideMastered === 'boolean') hideMastered = p.hideMastered;
  if (typeof p.typedMode === 'boolean') typedMode = p.typedMode;
  if (typeof p.audioMode === 'boolean') audioMode = p.audioMode;
  if (typeof p.filtersExpanded === 'boolean') filtersExpanded = p.filtersExpanded;
  if (studyModes.some(m => m.id === p.studyMode)) studyMode = p.studyMode;
  if (NEW_LIMITS.includes(p.newPerDay)) newPerDay = p.newPerDay;
  if (p.tab === 'verbs') tab = 'verbs';
  if (p.vtMode === 'drill') vtMode = 'drill';
  if (Array.isArray(p.tenses)) {
    const valid = p.tenses.filter(t => TENSES.some(x => x.id === t));
    if (valid.length) {
      activeTenses = new Set(valid);
      const knownT = new Set(p.knownTenses || []);
      for (const t of TENSES) if (!knownT.has(t.id)) activeTenses.add(t.id);
    }
  }
  if (Array.isArray(p.verbsOff)) for (const id of p.verbsOff) activeVerbs.delete(id);

  migrateLegacyMastery();

  document.getElementById('shuffle-btn').classList.toggle('active', shuffled);
  document.getElementById('mastered-btn').classList.toggle('active', hideMastered);
  document.getElementById('typed-btn').classList.toggle('active', typedMode);
  initVoices();
  syncAudioBtn();
  syncNewLimitBtn();
  pruneLogs();
  if (tab === 'verbs' && vtMode === 'drill') newDrillPrompt();
  buildPills();
  buildVtPills();
  applyFilters();
})();
</script>
